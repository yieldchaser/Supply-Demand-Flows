# Dataset-integrity rules - one stanza per curated source.
#
# Why this file exists:
#     A curated parquet once sat frozen at a single gas day for 74
#     consecutive runs while its scraper health file kept reporting "ok".
#     These rules let validators/integrity.py audit the *dataset* itself
#     (schema, values, staleness, gaps, shrinkage) independently of scraper
#     liveness.
#
# Conventions:
#     * paths are repo-relative
#     * staleness thresholds compare (today - newest period) in days;
#       both arms use strict > semantics (exactly warn_days stays PASS)
#     * copy a commented placeholder block when a new source's scraper lands

defaults:
  # check_divergence keys its stale-period arm off each source's OWN
  # staleness.fail_days (not warn_days): fail-level staleness under an "ok"
  # health stamp = degradation; warn-level lag is normal publication delay.
  # Lag-sensitive sources must set fail_days ABOVE their worst legitimate
  # lag (eia_lng_exports / eia_supply pin 135d against a real ~114d lag).
  # Canonical column contract enforced by check_schema on every frame.
  schema_columns: [source, series_id, series_name, period, value, unit, region, ingested_at]
  # Max allowed % drop in distinct series_id vs the prior stored baseline;
  # a bigger drop means upstream silently stopped publishing series.
  coverage_drop_fail_pct: 20
  # A health stamp older than this cannot vouch for the dataset in the
  # divergence meta-check (scraper may have died after its last write).
  health_recency_days: 3

sources:
  gulf_south:
    parquet: data/curated/gulf_south.parquet
    health_file: data/health/gulf_south.json
    staleness:
      warn_days: 2            # intraday feed; one quiet day is worth a look
      fail_days: 4            # past a long weekend without postings = broken
    gap_rule: calendar_daily  # every gas day between oldest/newest must exist
    unit_expected: Dth/d      # unit column may contain exactly this value only
    negative_values_fail: true  # scheduled quantities can never be negative
    mode: accumulation        # rows only ever grow; enables flat-run divergence arm
    bands:
      - label: freeport_lng_feedgas
        series_glob: "gulf_south_sq_24329_*"  # Freeport LNG feedgas meters
        min: 0.0              # inclusive floor - zero flow is legitimate, never flagged
        max: 2860000.0        # ~nameplate headroom; above this = unit/data error

  gie_agsi:
    parquet: data/curated/gie_agsi.parquet
    health_file: data/health/gie_agsi.json
    staleness:
      warn_days: 3            # AGSI publishes T-1; weekend lag is normal
      fail_days: 6
    unit_expected: null       # rows mix TWh/GWh/% so schema skips the unit check
    mode: accumulation        # rows only ever grow; enables flat-run divergence arm
    gap_rule: calendar_daily  # daily at dataset level (country publication offsets evaluated at source level)

  baker_hughes:
    parquet: data/curated/baker_hughes_weekly.parquet
    health_file: data/health/baker_hughes_rigs.json
    health_recency_days: 9    # weekly Friday release cadence (7d interval + 2d grace)
    staleness:
      warn_days: 9            # weekly release; tolerate one skipped week
      fail_days: 18
    unit_expected: rigs       # rig counts are unitless integers labelled "rigs"
    mode: accumulation        # rows only ever grow; enables flat-run divergence arm
    gap_rule: weekly_friday   # published weekly on Fridays (holiday shifts to Thursday tolerated)

  eia_storage:
    parquet: data/curated/eia_storage.parquet
    health_file: data/health/eia_storage.json
    health_recency_days: 9    # weekly Thursday release cadence (7d interval + 2d grace)
    skip_checks: [flow_legs]   # series are per-region aggregates; uniqueness is per (name, period)
    staleness:
      warn_days: 9            # weekly Thursday release with multi-day lag
      fail_days: 18           # >14d stale on a core source must page (brief: FAIL >14 days)
    unit_expected: Bcf        # weekly lower-48 stocks in Bcf
    mode: accumulation        # rows only ever grow; enables flat-run divergence arm
    gap_rule: weekly_friday   # weekly data; published Thursdays but period is week-ending Friday
    # Sixth silent-loss incident (2026-08-25): a rebuild-from-thin-raw cut
    # this source 3600→408 rows. The global coverage_drop_fail_pct (20%)
    # plus shrinkage/divergence arms now apply; nothing may silently drop
    # more than a fifth of its rows between monitored runs.
    bands:
      - label: storage_lower48_plausible
        series_glob: "storage_lower48"
        min: 0.0
        max: 6000.0           # Bcf; observed max ~3960 — headroom for growth

  eia_lng_exports:
    parquet: data/curated/eia_lng_exports.parquet
    health_file: data/health/eia_lng.json
    health_recency_days: 45   # monthly Census publication cadence (~30d interval + 15d grace)
    skip_checks: [flow_legs]   # coarse country ids repeat (id,period) across series_name rows; uniqueness lives on name, not id
    staleness:
      warn_days: 105          # EIA export destination series (EVE) compiled from Census foreign trade data; normal lag is 90-115d
      fail_days: 135          # accommodates normal 3-month Census publication lag at PASS, warns if delayed >3.5 months, fails at 4.5 months
    month_end_normalize: true  # monthly periods compare as last-day-of-month
    mode: accumulation        # rows only ever grow; enables flat-run divergence arm
    gap_rule: monthly         # monthly cadence (consecutive YYYY-MM periods)
    # no unit_expected: export volumes arrive in mixed units by series

  eia_supply:
    parquet: data/curated/eia_supply.parquet
    health_file: data/health/eia_supply.json
    health_recency_days: 45   # monthly Natural Gas Monthly release cadence (~30d interval + 15d grace)
    staleness:
      warn_days: 75           # EIA Natural Gas Monthly releases on last business day of M+2 (~60-65d normal lag; warns if M+3 is delayed)
      fail_days: 135          # 4.5 months; covers two missed monthly cycles
    month_end_normalize: true  # snap bare months to month-end before ageing
    period_format: "%Y-%m"   # periods arrive as bare months, e.g. "2026-07"
    mode: accumulation        # rows only ever grow; enables flat-run divergence arm
    gap_rule: monthly         # monthly cadence (consecutive YYYY-MM periods)

  # ---- EBB daily sources (scrapers landed 2026-08-23 integration) --------

  gasnom:
    parquet: data/curated/gasnom.parquet
    # Canonical health merged across all 4 pipelines (goldenpass, cameron, SABINE, portarthurpipeline)
    health_file: data/health/gasnom.json
    staleness: {warn_days: 2, fail_days: 4}  # daily EBB
    unit_expected: Dth/d
    mode: accumulation
    gap_rule: calendar_daily
    prefix_gaps: true
    # In-service dates by pipeline prefix (§03 / AA2).
    # Mask pre-service runs from gap check; post-service gaps still fire.
    in_service_dates:
      # Port Arthur LNG pipeline: first commercial feedgas posting is 2026-06-08 per curated GasNom history (pre-commissioning testing)
      port_arthur_pipeline: "2026-06-08"

  quorum:
    parquet: data/curated/quorum.parquet
    health_file: data/health/quorum.json
    staleness: {warn_days: 2, fail_days: 4}  # daily EBB
    unit_expected: Dth/d
    mode: accumulation
    gap_rule: calendar_daily  # upstream retention holes emit WARN (never FAIL) for operator visibility
    prefix_gaps: true
    # negative_values_fail stays unset: operator posts genuine negative TSQ
    # adjustments (BRL -5,000 on 2023-02-23).
    bands:
      - label: vg_feedgas_and_receipts
        series_glob: "*"       # all quorum series (sq + oac, both pipes)
        min: -100000.0         # headroom for payback adjustments below zero
        max: 6000000.0         # above observed max 4,392,777 (design 3.94M)

  bhe:
    parquet: data/curated/bhe.parquet
    health_file: data/health/bhe.json   # created by CI on first scheduled run
    staleness: {warn_days: 2, fail_days: 4}  # daily EBB
    unit_expected: Dth/d
    mode: accumulation
    gap_rule: calendar_daily
    prefix_gaps: true
    # Zeros are LEGITIMATE here: Cove Point flow is cargo-driven, so flat
    # zero days are real operating state, never flagged.
    bands:
      # Plant INTAKE (feedgas actually liquefied) — bounded near nameplate.
      - label: cove_point_plant_intake_feedgas
        series_glob: "cpl_sq_10001_*"
        min: 0.0              # inclusive floor — zero flow is legitimate
        max: 1100000.0        # above observed max 848,200 Dth/d
      # Plant SENDOUT (delivery to Transco/domestic) is a DIFFERENT meter
      # (SI/D) that correctly exceeds feedgas nameplate — it carries the
      # full LNG sendout, not just liquefaction intake. Sized to its real
      # observed max (~2.59M Dth/d), not the 750k feedgas denominator.
      - label: cove_point_plant_sendout_oac
        series_glob: "cpl_oac_10001_*"
        min: 0.0
        max: 3000000.0        # above observed max 2,593,551 Dth/d
      - label: cove_point_plant_sendout_opcap
        series_glob: "cpl_opcap_10001_*"
        min: 0.0
        max: 2200000.0        # above observed max 1,800,000 Dth/d

  cheniere:
    parquet: data/curated/cheniere.parquet
    health_file: data/health/cheniere.json  # created by CI on first run
    staleness: {warn_days: 2, fail_days: 4}  # daily EBB
    unit_expected: Dth/d
    mode: accumulation
    gap_rule: calendar_daily
    prefix_gaps: true
    # Cheniere posts CAPACITY (OAC), not scheduled flow — bands sized to
    # nameplate-style magnitudes, not nomination volumes.
    # negative_values_fail stays unset: observed min -94,704 is operator-posted.
    bands:
      - label: creole_trail_corpus_christi_oac
        series_glob: "*"
        min: -200000.0        # payback/recycle adjustments below zero
        max: 4000000.0        # above observed max 2,750,000

  enbridge:
    parquet: data/curated/enbridge.parquet
    health_file: data/health/enbridge.json  # created by CI on first scheduled run
    staleness: {warn_days: 2, fail_days: 4}  # multi-cycle daily EBB
    unit_expected: Dth/d
    mode: accumulation
    gap_rule: calendar_daily
    negative_values_fail: true
    # TETCO OAC/TSQ magnitudes; the Freeport anchor (79999 STRATTON RIDGE)
    # runs ~250-300k Dth/d against a 322k design cap.
    bands:
      - label: freeport_stratton_ridge_sq
        series_glob: "tetco_sq_79999_*"
        min: 0.0              # inclusive floor — zero flow is legitimate
        max: 400000.0         # above design capacity 322,000

  # SHELVED 2026-08-25: the transco stanza is commented out — the legacy JSP
  # endpoints are gone (1Line portal-app migration, see
  # scrapers/williams/VERDICT.md) and active monitoring would emit permanent
  # WARN staleness noise. Restore this stanza if a new public API appears.
  #
  # transco:
  #   parquet: data/curated/williams.parquet
  #   health_file: data/health/transco.json
  #   staleness: {warn_days: 2, fail_days: 4}
  #   unit_expected: Dth/d
  #   mode: accumulation
  #   bands:
  #     - label: transco_watchlist_capacity
  #       series_glob: "*"
  #       min: -100000.0
  #       max: 5000000.0

  kinder_morgan:
    parquet: data/curated/kinder_morgan.parquet
    health_file: data/health/kinder_morgan.json  # created by CI on first scheduled run
    staleness: {warn_days: 2, fail_days: 4}  # BEST-AVAILABLE snapshot, ~3x daily
    unit_expected: Dth/d      # raw values since 2026-08-25 (rule 5: frontend converts)
    mode: accumulation
    gap_rule: calendar_daily
    prefix_gaps: true
    negative_values_fail: true
    # Confirmed LNG-bound meters only (Sabine recon + CI live-fire 2026-08-25).
    # KMLP 44337 CALCA deliberately absent — Calcasieu corridor, not Sabine.
    bands:
      - label: km_ngpl_sabine_sq
        series_glob: "km_ngpl_sq_3592_*"
        min: 0.0              # zero flow is legitimate (no nomination that cycle)
        max: 600000.0         # above design capacity 500,000 Dth/d (~488 MMcf/d)
      - label: km_tgp_corpus_sq
        series_glob: "km_tgp_sq_49861_*"
        min: 0.0
        max: 900000.0         # above design capacity 768,750 Dth/d (~750 MMcf/d)
      - label: km_tgp_area_candidates
        series_glob: "km_tgp_sq_{47799,49524}_*"
        min: 0.0
        max: 900000.0
