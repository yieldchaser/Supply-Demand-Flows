name: Williams Transco (5x daily)

on:
  schedule:
    # All times UTC. Transco posts OAC per NAESB cycle (Central Time):
    #   Timely:  ~1:30 PM CT -> 19:30 UTC (+1h buffer)
    - cron: '30 2 * * *'
    #   Evening: ~9:00 PM CT -> 03:00 UTC (+1h buffer)
    - cron: '0 3 * * *'
    #   Intraday 1: ~6:00 AM CT next day -> 12:15 UTC
    - cron: '15 12 * * *'
    #   Intraday 2: ~11:00 AM CT next day -> 17:15 UTC
    - cron: '15 17 * * *'
    #   Intraday 3 (final): ~4:00 PM CT next day -> 22:15 UTC
    - cron: '15 22 * * *'
  workflow_dispatch:
    inputs:
      gas_day:
        description: 'Gas day (YYYY-MM-DD, optional — omit for today)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: williams-${{ github.event.schedule || 'dispatch' }}
  cancel-in-progress: true

jobs:
  fetch:
    name: Fetch and commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        cycle: [timely, evening, id1, id2, id3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Resolve gas day
        id: window
        env:
          GAS_DAY_INPUT: ${{ inputs.gas_day }}
        run: |
          DAY="$GAS_DAY_INPUT"
          if [ -z "$DAY" ]; then DAY=$(date -u +%Y-%m-%d); fi
          echo "gas_day=$DAY" >> $GITHUB_OUTPUT
          echo "Gas day: $DAY"

      - name: Run Williams scraper (cycle)
        id: scrape
        env:
          CYCLE: ${{ matrix.cycle }}
          GAS_DAY: ${{ steps.window.outputs.gas_day }}
        run: |
          python -m scrapers.williams --cycle "$CYCLE" --date "$GAS_DAY" \
            | tee /tmp/scraper_output.json
          STATUS=$(python -c "import json; print(json.load(open('/tmp/scraper_output.json'))['status'])")
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Transform raw to curated
        if: steps.scrape.outputs.status == 'ok'
        run: python -m transformers.williams

      - name: Commit
        if: steps.scrape.outputs.status == 'ok'
        env:
          CYCLE: ${{ matrix.cycle }}
          GAS_DAY: ${{ steps.window.outputs.gas_day }}
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/transco.json || true
          git add data/curated/williams.parquet || true
          git rm -r --cached --ignore-unmatch data/raw/williams >/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data(transco): OAC ${GAS_DAY} ${CYCLE}"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi

      - name: Report skip or empty
        if: steps.scrape.outputs.status == 'skipped' || steps.scrape.outputs.status == 'empty'
        env:
          CYCLE: ${{ matrix.cycle }}
          GAS_DAY: ${{ steps.window.outputs.gas_day }}
        run: echo "Cycle ${CYCLE} for gas day ${GAS_DAY} has no new posting yet"

      - name: Report failure
        if: steps.scrape.outputs.status == 'failed'
        env:
          CYCLE: ${{ matrix.cycle }}
          GAS_DAY: ${{ steps.window.outputs.gas_day }}
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/transco.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data(transco): health update (${CYCLE} failure recorded)"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi
          exit 1
