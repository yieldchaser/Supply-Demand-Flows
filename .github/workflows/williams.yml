name: Williams Transco (SHELVED 2026-08-25 — manual only)

# SHELVED: the legacy JSP endpoints (OACQueryRequest.jsp / OACreport.jsp) no
# longer exist — 1Line migrated to the portal-app SPA and every path serves
# the SPA catch-all shell (see scrapers/williams/VERDICT.md). Scheduled runs
# would write empty/warn health forever, so the schedule is DISABLED (not just
# commented) and only manual workflow_dispatch remains for re-verification if
# Williams exposes a public API again.
#
# The scraper is expected to return `failed`/`empty` against the dead
# endpoints, so the failure path below is NON-FATAL (no `exit 1`): a shelved
# pipeline must never turn CI red. Health is still recorded; no data is
# committed (transform/commit steps require status == 'ok').
on:
  workflow_dispatch:
    inputs:
      gas_day:
        description: 'Gas day (YYYY-MM-DD, optional — omit for today)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: williams-dispatch
  cancel-in-progress: true

jobs:
  fetch:
    name: Fetch and commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        cycle: [timely, evening, id1, id2, id3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Resolve gas day
        id: window
        env:
          GAS_DAY_INPUT: ${{ inputs.gas_day }}
        run: |
          DAY="$GAS_DAY_INPUT"
          if [ -z "$DAY" ]; then DAY=$(date -u +%Y-%m-%d); fi
          echo "gas_day=$DAY" >> $GITHUB_OUTPUT
          echo "Gas day: $DAY"

      - name: Run Williams scraper (cycle)
        id: scrape
        continue-on-error: true
        env:
          CYCLE: ${{ matrix.cycle }}
          GAS_DAY: ${{ steps.window.outputs.gas_day }}
        run: |
          python -m scrapers.williams --cycle "$CYCLE" --date "$GAS_DAY" \
            | tee /tmp/scraper_output.json
          STATUS=$(python -c "import json; print(json.load(open('/tmp/scraper_output.json'))['status'])")
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Transform raw to curated
        if: steps.scrape.outputs.status == 'ok'
        run: python -m transformers.williams

      - name: Commit
        if: steps.scrape.outputs.status == 'ok'
        env:
          CYCLE: ${{ matrix.cycle }}
          GAS_DAY: ${{ steps.window.outputs.gas_day }}
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/transco.json || true
          git add data/curated/williams.parquet || true
          git rm -r --cached --ignore-unmatch data/raw/williams >/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data(transco): OAC ${GAS_DAY} ${CYCLE}"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi

      - name: Report skip or empty
        if: steps.scrape.outputs.status == 'skipped' || steps.scrape.outputs.status == 'empty'
        env:
          CYCLE: ${{ matrix.cycle }}
          GAS_DAY: ${{ steps.window.outputs.gas_day }}
        run: echo "Cycle ${CYCLE} for gas day ${GAS_DAY} has no new posting yet"

      - name: Report failure (shelved — non-fatal, do NOT fail CI)
        if: steps.scrape.outputs.status == 'failed'
        env:
          CYCLE: ${{ matrix.cycle }}
          GAS_DAY: ${{ steps.window.outputs.gas_day }}
        run: |
          echo "Cycle ${CYCLE} for gas day ${GAS_DAY} failed (shelved endpoint — expected)."
          echo "Recording health only; not failing CI."
