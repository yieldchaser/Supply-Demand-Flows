name: ENTSOG EU Imports (daily)

on:
  schedule:
    - cron: '37 10 * * *'  # Daily, after operators publish the previous gas day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entsog
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ENTSOG scraper (last 45 days)
        id: scrape
        run: |
          python -m scrapers.entsog.flows | tee /tmp/scraper_output.json
          STATUS=$(python -c "import json; print(json.load(open('/tmp/scraper_output.json'))['status'])")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" = "ok" ]; then
            GAS_DAY=$(python -c "import json; print(json.load(open('/tmp/scraper_output.json'))['latest_gas_day'])")
            echo "gas_day=$GAS_DAY" >> $GITHUB_OUTPUT
          fi

      # A partial run (a failed batch) is not transformed: a route summed over
      # some of its points would be understated. Tomorrow's 45-day window
      # re-fetches the same days.
      - name: Transform raw -> curated
        if: steps.scrape.outputs.status == 'ok'
        run: python -m transformers.entsog

      - name: Commit
        if: steps.scrape.outputs.status == 'ok'
        env:
          GAS_DAY: ${{ steps.scrape.outputs.gas_day }}
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/entsog.json || true
          git add data/curated/entsog.parquet || true
          if ! git diff --cached --quiet; then
            git commit -m "data(entsog): EU imports ${GAS_DAY}"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi

      - name: Report failure
        if: steps.scrape.outputs.status != 'ok' || failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/entsog.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data(entsog): health update (failure recorded)"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi
          exit 1
