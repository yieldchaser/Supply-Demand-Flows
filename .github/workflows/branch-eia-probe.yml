name: Branch run - EIA trade & consumption (temporary)

# Temporary, branch-only: runs the new EIA trade/consumption scraper with the
# repo's EIA_API_KEY and commits the curated parquet to THIS branch only, so the
# PR ships with data. Never pushes to main. Delete before merge.

on:
  push:
    branches:
      - claude/supply-demand-flows-audit-fwh61b
    paths:
      - '.github/workflows/branch-eia-probe.yml'
      - 'scrapers/eia_api/flows.py'
      - 'transformers/eia_flows.py'
      - 'scrapers/eia_api/lng_exports.py'
      - 'transformers/eia_lng_exports.py'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m scrapers.eia_api.flows
      - name: Transform
        run: python -m transformers.eia_flows
      - name: LNG exports by destination (paginated) + transform
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python -m scrapers.eia_api.lng_exports
          python -m transformers.eia_lng_exports
      - name: Probe - storage legs in Table 1 (read-only, prints to log)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          k = os.environ["EIA_API_KEY"]
          base = "https://api.eia.gov/v2/natural-gas/stor/sum"
          def get(url, **q):
              q["api_key"] = k
              with urllib.request.urlopen(url + "?" + urllib.parse.urlencode(q, doseq=True), timeout=60) as r:
                  return json.load(r)["response"]
          for f in get(base + "/facet/process/")["facets"]:
              print("PROCESS", f.get("id"), "|", f.get("name"))
          rows = get(base + "/data/", frequency="monthly", **{"data[]": "value", "facets[duoarea][]": "NUS", "start": "2022-01", "end": "2022-07", "length": "500"})["data"]
          for r in rows:
              if r["period"] in ("2022-01", "2022-07"):
                  print("ROW", r["period"], r["process"], r.get("process-name"), r.get("series-description"), r["value"], r.get("units"))
          PY
      - name: Commit to this branch only
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/curated/eia_flows.parquet data/health/eia_flows.json data/curated/eia_lng_exports.parquet data/health/eia_lng.json
          if ! git diff --cached --quiet; then
            git commit -m "data(eia): branch run, trade & consumption; LNG exports re-fetched with pagination"
            git push origin HEAD:${{ github.ref_name }}
          fi
