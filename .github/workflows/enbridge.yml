name: TETCO via Enbridge rtba (5x daily)

on:
  schedule:
    # All times UTC. TETCO posts OAC per NAESB cycle (Central Time);
    # rtba intraday re-posts land through the next morning:
    #   Timely:      ~3:00 PM CT → 21:00 UTC (+1h buffer)
    - cron: '0 22 * * *'
    #   Evening:     ~8:00 PM CT → 02:00 UTC (+30m buffer)
    - cron: '0 3 * * *'
    #   Intraday AM: ~9:00 AM CT next day → 15:00 UTC
    - cron: '0 16 * * *'
    #   Intraday PM: ~2:00 PM CT next day → 20:00 UTC
    - cron: '0 21 * * *'
    #   Late sweep: catch stragglers / corrections before the daily publish
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      begin_date:
        description: 'Begin gas day (YYYY-MM-DD, optional — omit for today)'
        required: false
        type: string
      end_date:
        description: 'End gas day (YYYY-MM-DD, optional — omit for today)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: enbridge-${{ github.event.schedule || 'dispatch' }}
  cancel-in-progress: true

jobs:
  fetch:
    name: Fetch and commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Determine gas-day window
        id: window
        run: |
          BEGIN="${{ inputs.begin_date }}"
          END="${{ inputs.end_date }}"
          if [ -z "$BEGIN" ]; then BEGIN=$(date -u -d 'yesterday' +%Y-%m-%d); fi
          if [ -z "$END" ]; then END=$(date -u +%Y-%m-%d); fi
          echo "begin_date=$BEGIN" >> $GITHUB_OUTPUT
          echo "end_date=$END" >> $GITHUB_OUTPUT
          echo "Window: $BEGIN → $END"

      - name: Run TETCO (Enbridge rtba) scraper
        id: scrape
        run: |
          python -m scrapers.enbridge.client \
            ${{ steps.window.outputs.begin_date }} \
            ${{ steps.window.outputs.end_date }} \
          | tee /tmp/scraper_output.json
          STATUS=$(python -c "import json; print(json.load(open('/tmp/scraper_output.json'))['status'])")
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Transform raw → curated
        if: steps.scrape.outputs.status == 'ok'
        run: python -m transformers.enbridge

      - name: Commit
        if: steps.scrape.outputs.status == 'ok'
        env:
          BEGIN: ${{ steps.window.outputs.begin_date }}
          END: ${{ steps.window.outputs.end_date }}
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/enbridge.json || true
          git add data/curated/enbridge.parquet || true
          if ! git diff --cached --quiet; then
            git commit -m "data(enbridge): TETCO OAC ${BEGIN}..${END}"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi

      - name: Report skip
        if: steps.scrape.outputs.status == 'skipped'
        run: echo "Staleness gate held — already have ${BEGIN}..${END}"

      - name: Report failure
        if: steps.scrape.outputs.status == 'failed' || failure()
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/enbridge.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data(enbridge): health update (failure recorded)"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi
          exit 1
