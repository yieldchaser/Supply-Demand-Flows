name: Williams Debug Probe 11
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, re, json
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json, text/plain, */*"}
          # mine the main bundle for endpoint fragments after 'portal-service/v1/'
          with httpx.Client(headers=UA, timeout=60.0) as c:
              js = c.get("https://www.1line.williams.com/main-ZSQ4H6XM.js").text
              i = 0
              frags = set()
              for m in re.finditer(r'portal-service/v1/', js):
                  seg = js[m.start()-80:m.start()+120]
                  # capture string literals near it
                  frags.add(re.sub(r"\s+", " ", seg)[:200])
                  i += 1
                  if i > 8: break
              for f in sorted(frags)[:8]:
                  print("FRAG:", f)
              # try known enbridge infopost OAC endpoints against williams host
              tries = [
                  "https://www.1line.williams.com/api/portal-service/v1/oac/postings?businessUnit=TE",
                  "https://www.1line.williams.com/api/portal-service/v1/postings?bu=80",
                  "https://www.1line.williams.com/api/portal-service/v1/breadcrumb?buId=80",
                  "https://infopost.enbridge.com/api/portal-service/v1/oac/postings?businessUnit=TE",
              ]
              for u in tries:
                  try:
                      rr = c.get(u)
                      ct = rr.headers.get("content-type", "?")
                      body = rr.text[:180].replace("\n", " ")
                      print("TRY", u[-70:], "->", rr.status_code, ct[:24], body)
                  except Exception as e:
                      print("TRY", u[-70:], "ERR", type(e).__name__)
          PYEOF
          python /tmp/probe.py
