name: Williams Live Probe 11
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, re, json
          BASE = "https://www.1line.williams.com"
          UA = {"User-Agent": "Mozilla/5.0"}
          with httpx.Client(headers=UA, timeout=40.0) as c:
              r = c.get(BASE + "/", headers={"Accept": "text/html"})
              print("STATUS:", r.status_code)
              for k, v in r.headers.items():
                  if k.lower() in ("set-cookie", "server", "x-powered-by", "via", "location"):
                      print("HDR:", k, "=", v[:160])
              print("COOKIES:", dict(c.cookies))
              cfg = c.get(BASE + "/chunk-3DTYLSSE.js").text[:1800]
              print("CHUNK3D:", cfg)
          PYEOF
          python /tmp/probe.py
