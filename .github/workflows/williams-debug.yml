name: Williams Debug Probe 8
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, re
          BASE = "https://www.1line.williams.com"
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}
          with httpx.Client(base_url=BASE, headers=UA, timeout=60.0) as c:
              html = c.get("/").text
              print("INDEX len:", len(html))
              m = re.findall(r'src="([^"]+main[^"]*\.js)"', html)
              print("MAINJS:", m)
              mainjs = m[0] if m else None
              # runtime/config chunks referenced by index
              for cfg in ("/assets/config.json", "/config.json", "/assets/app-config.json", "/runtime-config.js"):
                  rr = c.get(cfg)
                  print("CFG", cfg, "->", rr.status_code, rr.text[:200].replace("\n"," "))
              if mainjs:
                  blob = c.get(mainjs if mainjs.startswith("/") else "/" + mainjs).text
                  abs_urls = sorted(set(re.findall(r'https?://[A-Za-z0-9_.-]+[A-Za-z0-9_/.-]*', blob)))
                  hosts = sorted({u.split("/")[2] for u in abs_urls})[:25]
                  print("HOSTS:", hosts)
                  api_paths = sorted({p for p in re.findall(r'"(/api/[A-Za-z0-9_/.-]+)"', blob)})[:30]
                  print("APIPATHS:", api_paths)
                  env = re.findall(r'(portalService|apiUrl|baseUrl|environment)[^,;]{0,120}', blob)[:10]
                  for e in env:
                      print("ENV:", e[:180])
          PYEOF
          python /tmp/probe.py
