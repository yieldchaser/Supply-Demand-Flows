name: Williams Live Probe 5
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, re
          BASE = "https://www.1line.williams.com"
          UA = {"User-Agent": "Mozilla/5.0"}
          targets = ["chunk-3DTYLSSE.js", "chunk-SITE44NT.js", "chunk-CWI3U72L.js", "chunk-3QM66RYT.js", "main-ZSQ4H6XM.js"]
          with httpx.Client(headers=UA, timeout=60.0) as c:
              for t in targets:
                  r = c.get(f"{BASE}/{t}")
                  blob = r.text
                  urls = sorted(set(re.findall(r'https?://[A-Za-z0-9_.\-]+(?:[.:][A-Za-z0-9_/\-]+)?', blob)))
                  interesting = [u for u in urls if any(k in u.lower() for k in ("williams", "api", "portal", "1line"))]
                  cfgfetch = re.findall(r'.{60}(?:configuration|config)\.json.{60}', blob)[:2]
                  print("==", t, len(blob))
                  if interesting:
                      print("URLS:", interesting[:12])
                  for cf in cfgfetch:
                      print("CFGCTX:", cf.replace("\n", " ")[:180])
                  envm = re.findall(r'(window\.[A-Za-z]+\s*=\s*\{[^}]{0,200})', blob)[:3]
                  for e in envm:
                      print("WINEV:", e[:220])
          PYEOF
          python /tmp/probe.py
