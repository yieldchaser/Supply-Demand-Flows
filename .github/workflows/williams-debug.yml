name: Williams Debug Probe 10
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, re
          BASE = "https://www.1line.williams.com"
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}
          with httpx.Client(base_url=BASE, headers=UA, timeout=60.0) as c:
              html = c.get("/").text
              tags = re.findall(r"<script[^>]*>", html)
              for t in tags[:8]:
                  print("TAG:", t[:200])
              hrefs = re.findall(r'<link[^>]*href="([^"]+)"', html)
              print("LINKHREFS:", [h for h in hrefs if h.endswith(".js")][:6])
              # fetch every js and grep hosts + api paths
              alljs = []
              for t in tags:
                  m = re.search(r'src="([^"]+)"', t)
                  if m:
                      alljs.append(m.group(1))
              blob = ""
              for s in alljs:
                  u = s if s.startswith("http") else BASE + (s if s.startswith("/") else "/" + s)
                  r = c.get(u)
                  blob += r.text
                  print("FETCHED", u[-50:], len(r.text))
              hosts = sorted({mm.split("//")[1] for mm in re.findall(r'https?://[A-Za-z0-9_.\-]+', blob)})
              print("HOSTS:", hosts[:30])
              api = sorted(set(re.findall(r'/api/[A-Za-z0-9_/.\-]+', blob)))[:40]
              print("APIPATHS:", api)
          PYEOF
          python /tmp/probe.py
