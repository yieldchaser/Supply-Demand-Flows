name: Williams Live Probe 6
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, re
          BASE = "https://www.1line.williams.com"
          UA = {"User-Agent": "Mozilla/5.0"}
          prefixes = [
              "/api/portal-service/v1/public/oac/report?gasFlowDate=08-23-2026&cycle=1&buId=80",
              "/api/portal-service/v1/oac/report",
              "/services/portal-service/v1/public/oac/cycle",
              "/portal/api/portal-service/v1/public/oac/cycle",
              "/ebbCode/rest/public/oac/cycle",
              "/rest/public/oac/cycle?buId=80",
          ]
          with httpx.Client(headers=UA, timeout=40.0) as c:
              html = c.get(BASE + "/").text
              # find ALL lazy chunk urls in main bundle and fetch each; grep
              # every one for 'public/oac' context to see full URL construction
              main = c.get(BASE + "/main-ZSQ4H6XM.js").text
              for m in re.finditer(r'.{140}public/oac/query.{60}', main):
                  print("QCTX:", m.group(0).replace("\n", " ")[-320:])
                  break
              for m in re.finditer(r'.{100}concat\(t\.serviceGroupURL\).{160}', main):
                  print("BUILD:", m.group(0).replace("\n", " ")[:300])
                  break
              for p in prefixes[:2]:
                  r = c.get(BASE + p)
                  ct = r.headers.get("content-type", "")[:20]
                  print("TRY", p[:70], "->", r.status_code, ct)
          PYEOF
          python /tmp/probe.py
