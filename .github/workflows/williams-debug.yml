name: Williams Live Probe 10
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, json
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
                "Accept": "application/json"}
          tests = [
              ("https://www.1line.williams.com/api/portal-service/v1/public/cycle-indicators?buId=80", None),
              ("https://www.1line.williams.com/portal-service/v1/public/cycle-indicators?buId=80", None),
              ("https://infopost.enbridge.com/api/portal-service/v1/public/oac/cycle?buId=80", None),
              ("https://www.1line.williams.com/ebbcopilot/api/portal-service/v1/public/cycle-indicators?buId=80", None),
              ("https://api.1line.williams.com/api/portal-service/v1/public/cycle-indicators?buId=80", None),
              ("https://www.1line.williams.com/OACQueryRequest.jsp?BUID=80", None),
          ]
          with httpx.Client(headers=UA, timeout=40.0, follow_redirects=True) as c:
              for u, _ in tests:
                  try:
                      r = c.get(u)
                      ct = r.headers.get("content-type", "")[:20]
                      kind = "JSON" if "json" in ct else ("HTML" if "html" in ct else ct)
                      head = r.text[:120].replace("\n", " ") if kind != "HTML" else ""
                      print(u.split("//")[1][:60], "->", r.status_code, kind, head)
                  except Exception as e:
                      print(u.split("//")[1][:60], "ERR", type(e).__name__)
          PYEOF
          python /tmp/probe.py
