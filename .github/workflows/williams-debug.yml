name: Williams Live Probe 2
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, json, re
          BASE = "https://www.1line.williams.com"
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
                "Accept": "application/json, text/plain, */*",
                "Origin": BASE, "Referer": BASE + "/"}
          candidates = [
              "/portal-service/v1/public/oac/cycle?buId=80",
              "/api/portal-service/v1/public/oac/cycle",
              "/api/portal-service/public/oac/cycle?buId=80",
              "/public/oac/cycle?buId=80",
              "/oac/public/oac/cycle?buId=80",
          ]
          with httpx.Client(headers=UA, timeout=60.0) as c:
              for p in candidates:
                  r = c.get(BASE + p)
                  ct = r.headers.get("content-type", "")[:24]
                  marker = "JSON" if "json" in ct else ("HTML" if "html" in ct else ct)
                  body = r.text[:150].replace("\n", " ") if "json" in ct else ""
                  print(p, "->", r.status_code, marker, body)
              # mine main.js for how serviceGroupURL is consumed (prefix path)
              js = c.get(BASE + "/main-ZSQ4H6XM.js").text
              for m in re.finditer(r'.{80}serviceGroupURL.{200}', js):
                  seg = m.group(0).replace("\n", " ")
                  print("USE:", seg[:300])
                  break
          PYEOF
          python /tmp/probe.py
