name: Williams Live Probe 9
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, json
          BASE = "https://www.1line.williams.com"
          API = BASE + "/api/portal-service/v1"
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
                "Accept": "application/json"}
          with httpx.Client(headers=UA, timeout=60.0) as c:
              # cycle-indicators is a known-good GET: proves /public/* works
              r = c.get(API + "/public/cycle-indicators", params={"buId": 80})
              print("CYCLE-IND:", r.status_code, r.headers.get("content-type","")[:20], r.text[:300].replace("\n"," "))
              r2 = c.post(API + "/public/oac/query", json={
                  "buId": 80,
                  "gasFlowBeginDate": "08-23-2026",
                  "gasFlowEndDate": "08-23-2026",
                  "cycle": ["1"],
                  "locationIDs": [],
                  "reportType": "OAC",
              })
              print("QUERY:", r2.status_code, r2.headers.get("content-type","")[:20])
              print("BODY:", r2.text[:600].replace("\n"," "))
          PYEOF
          python /tmp/probe.py
