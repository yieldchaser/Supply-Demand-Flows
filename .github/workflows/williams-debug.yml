name: Williams Debug Probe 6
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, re, json
          BASE = "https://www.1line.williams.com"
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}
          with httpx.Client(base_url=BASE, headers=UA, timeout=60.0, follow_redirects=True) as c:
              r = c.get("/main-ZSQ4H6XM.js")
              blob = r.text
              # find portal-service endpoint fragments
              eps = sorted(set(re.findall(r'"[^"]*portal-service[^"]*"', blob)))[:40]
              for e in eps:
                  print("EP:", e[:160])
              # find words near 'oac' and 'location'
              for m in re.findall(r'.{50}[Oo][Aa][Cc].{80}', blob)[:10]:
                  print("OACCTX:", m.replace("\n", " ")[:180])
          PYEOF
          python /tmp/probe.py
