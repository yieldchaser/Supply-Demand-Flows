name: Williams Live Probe 12
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, json
          UA = {"User-Agent": "Mozilla/5.0"}
          with httpx.Client(headers=UA, timeout=60.0) as c:
              # all captures of the williams 1line host in the last year
              r = c.get(
                  "http://web.archive.org/cdx/search/cdx",
                  params={
                      "url": "1line.williams.com*",
                      "output": "json",
                      "from": "2024",
                      "limit": "200",
                      "collapse": "urlkey",
                  },
              )
              rows = r.json()
              print("CAPTURES:", len(rows))
              for row in rows[1:]:
                  url = row[2]
                  if any(k in url.lower() for k in ("oac", "api", "json", "query", "cycle")):
                      print("CAP:", row[1], row[3], url[:150])
          PYEOF
          python /tmp/probe.py
