name: Williams Debug Probe 12
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, re
          BASE = "https://www.1line.williams.com"
          UA = {"User-Agent": "Mozilla/5.0"}
          with httpx.Client(headers=UA, timeout=60.0) as c:
              html = c.get(BASE + "/").text
              js_files = re.findall(r'(?:src="|href=")([^"]+\.js)"', html)
              js_files = [j for j in set(js_files)]
              blob = ""
              for s in js_files:
                  u = s if s.startswith("http") else BASE + (s if s.startswith("/") else "/" + s)
                  blob += c.get(u).text
              # find chunk names referenced inside the bundles (lazy routes)
              chunks = sorted(set(re.findall(r'chunk-([A-Z0-9]+)\.js', blob)))
              print("CHUNKS:", len(chunks))
              # grep blob for gas-flow / OAC query markers
              for pat in ("GasFlowBeginDate", "gasFlowBeginDate", "locationIDs", "OACQueryRequest", "oac/report", "scheduledQuantit", "TotalScheduled"):
                  hits = [mm.start() for mm in re.finditer(pat, blob)][:2]
                  for hh in hits:
                      seg = blob[max(0,hh-100):hh+150].replace("\n", " ")
                      print("HIT:", pat, "::", seg[:220])
          PYEOF
          python /tmp/probe.py
