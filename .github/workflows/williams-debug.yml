name: Williams Debug Probe 2
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install httpx
      - name: Probe
        run: |
          python - <<'PY'
          import httpx, re
          BASE = "https://www.1line.williams.com"
          FORM = "/ebbCode/OACQueryRequest.jsp?BUID=80&type=OAC"
          with httpx.Client(base_url=BASE, headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}, timeout=30.0, follow_redirects=True) as c:
              r = c.get(FORM)
              html = r.text
              print("TITLE:", re.search(r"<title>(.*?)</title>", html, re.S).group(1) if "<title>" in html else "?")
              # find every <form ...> opening tag raw
              for m in re.findall(r"<form[^>]*>", html, re.I)[:5]:
                  print("FORMTAG:", m[:200])
              # find submitflag / openReport references
              for m in re.findall(r".{60}submitflag.{80}", html)[:3]:
                  print("CTX:", m.replace("\n"," ")[:180])
              for m in re.findall(r"function\s+openReport[^{]*\{.{0,400}", html, re.S)[:1]:
                  print("OPENREPORT:", m[:400].replace("\n", " "))
          PY
