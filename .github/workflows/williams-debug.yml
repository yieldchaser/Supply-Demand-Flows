name: Williams Live Probe 4
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, re, json
          BASE = "https://www.1line.williams.com"
          UA = {"User-Agent": "Mozilla/5.0"}
          with httpx.Client(headers=UA, timeout=60.0) as c:
              html = c.get(BASE + "/").text
              # all js assets incl. lazy chunks referenced in index
              scripts = re.findall(r'src="([^"]+\.js)"', html)
              print("INDEX SCRIPTS:", scripts)
              # common config file names
              found_cfg = None
              for cfg in ("assets/config/configuration.json", "assets/config.json", "config.json", "assets/configuration.json", "assets/env.json", "configuration.json"):
                  r = c.get(BASE + "/" + cfg)
                  if r.status_code == 200 and "html" not in r.headers.get("content-type", ""):
                      print("CONFIG FOUND:", cfg, "->", r.text[:500])
                      found_cfg = cfg
                      break
                  else:
                      print("cfg miss:", cfg, r.status_code)
              # dump every href/src from index for manual scan
              refs = sorted(set(re.findall(r'(?:src|href)="([^"]+)"', html)))
              print("REFS:", [r2 for r2 in refs if not r2.startswith("http")][:30])
          PYEOF
          python /tmp/probe.py
