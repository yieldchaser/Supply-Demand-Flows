name: Williams Debug Probe 7
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, json
          BASE = "https://www.1line.williams.com"
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36", "Accept": "application/json"}
          paths = [
              "/api/portal-service/v1/",
              "/api/portal-service/v1/oac",
              "/api/portal-service/v1/oac/cycles",
              "/api/portal-service/v1/oac/locations?buId=80",
              "/api/portal-service/v1/locations?buId=80",
              "/api/portal-service/v1/businessunits",
              "/api/portal-service/v1/business-units",
          ]
          with httpx.Client(base_url=BASE, headers=UA, timeout=30.0, follow_redirects=True) as c:
              r = c.get("/api/portal-service/v1/")
              print("ROOT:", r.status_code, r.text[:300])
              for p in paths[2:]:
                  try:
                      rr = c.get(p)
                      ct = rr.headers.get("content-type", "?")
                      print(p, "->", rr.status_code, ct[:30], rr.text[:200].replace("\n", " "))
                  except Exception as e:
                      print(p, "ERR", e)
          PYEOF
          python /tmp/probe.py
