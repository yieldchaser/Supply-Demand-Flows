name: Williams Live Probe 8
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, json, re
          BASE = "https://www.1line.williams.com"
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
                "Accept": "application/json"}
          with httpx.Client(headers=UA, timeout=60.0, follow_redirects=False) as c:
              js = c.get(BASE + "/main-ZSQ4H6XM.js").text
              # find every 'public/...' endpoint literal
              pubs = sorted(set(re.findall(r'"(public/[A-Za-z0-9_/\-]+)"', js)))
              print("PUBLIC EPS:", pubs[:30])
              # find base url token used before serviceGroupURL
              m = re.findall(r'.{120}SERVICE_GROUP_CONFIG.{200}', js)
              for s in m[:2]:
                  print("SGC:", s.replace("\n", " ")[:320])
          PYEOF
          python /tmp/probe.py
