name: Williams Live Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, json
          BASE = "https://www.1line.williams.com"
          API = BASE + "/api/portal-service/v1"
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
                "Accept": "application/json, text/plain, */*",
                "Origin": BASE, "Referer": BASE + "/"}
          with httpx.Client(headers=UA, timeout=60.0) as c:
              r = c.get(API + "/public/oac/cycle", params={"buId": 80})
              print("CYCLE:", r.status_code, r.headers.get("content-type","")[:24], r.text[:400])
              q = {
                  "buId": 80,
                  "gasFlowBeginDate": "08-23-2026",
                  "gasFlowEndDate": "08-23-2026",
                  "cycle": ["1"],
                  "locationIDs": [],
                  "reportType": "OAC",
              }
              r2 = c.post(API + "/public/oac/query", json=q)
              print("QUERY:", r2.status_code, r2.headers.get("content-type","")[:24])
              print("QBODY:", r2.text[:500].replace("\n", " "))
              r3 = c.get(API + "/public/oac/report", params={"buId": 80})
              ct = r3.headers.get("content-type","")
              print("REPORT:", r3.status_code, ct[:30], "len:", len(r3.text))
              if "json" in ct:
                  try:
                      data = r3.json()
                      s = json.dumps(data)[:600]
                      print("RJSON:", s)
                  except Exception as e:
                      print("RJSONERR:", e)
              else:
                  print("RTXT:", r3.text[:300].replace("\n"," "))
          PYEOF
          python /tmp/probe.py
