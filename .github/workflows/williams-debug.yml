name: Williams Debug Probe 9
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, re, json
          BASE = "https://www.1line.williams.com"
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}
          with httpx.Client(base_url=BASE, headers=UA, timeout=60.0) as c:
              html = c.get("/").text
              m = re.findall(r'src="([^"]+main[^"]*\.js)"', html)
              print("MAINJS:", m)
              if not m:
                  print(html[:800])
              else:
                  js = c.get(m[0]).text
                  print("JSLEN:", len(js))
                  abs_urls = sorted(set(re.findall(r'https?://[A-Za-z0-9_.\-]+', js)))
                  hosts = sorted({u.split("//")[1] for u in abs_urls})
                  print("HOSTS:", hosts[:30])
                  api_paths = sorted(set(re.findall(r'"(\/api\/[A-Za-z0-9_/.\-]+)"', js)))[:30]
                  print("APIPATHS:", api_paths)
                  cfg = re.findall(r'(portalService|apiUrl|baseUrl|envJson|appConfig)["\']?\s*[:=]\s*["\']([^"\']{5,120})', js)[:12]
                  for k, v in cfg:
                      print("CFGPAIR:", k, "=", v)
          PYEOF
          python /tmp/probe.py
