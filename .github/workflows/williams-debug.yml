name: Williams Final Verdict
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx, re
          UA = {"User-Agent": "Mozilla/5.0"}
          with httpx.Client(headers=UA, timeout=40.0) as c:
              # 1) does the SPA route to an OAC page? fetch its routing config
              main = c.get("https://www.1line.williams.com/main-ZSQ4H6XM.js").text
              routes = sorted(set(re.findall(r'"([a-z-]*oac[a-z-/]*)"', main)))[:20]
              print("OAC ROUTES:", routes)
              # 2) is there a dedicated OAC micro-frontend remote entry?
              mfe = sorted(set(re.findall(r'"([A-Za-z0-9_/.-]*remoteEntry[A-Za-z0-9_.-]*)"|'([A-Za-z0-9_/.-]*remoteEntry[A-Za-z0-9_.-]*)'', main)))
              print("MFE RAW:", mfe[:6])
              mfe2 = sorted(set(re.findall(r'[\w/.-]*remoteEntry\.js', main)))[:10]
              print("MFE:", mfe2)
          PYEOF
          python /tmp/probe.py
