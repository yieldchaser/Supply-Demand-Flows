name: Williams Live Probe 14
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Write probe script
        run: |
          cat > /tmp/probe.py <<'PYEOF'
          import httpx
          UA = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
              "Origin": "https://www.1line.williams.com",
              "Referer": "https://www.1line.williams.com/",
              "Sec-Fetch-Dest": "empty",
              "Sec-Fetch-Mode": "cors",
              "Sec-Fetch-Site": "same-origin",
          }
          tests = [
              "https://www.1line.williams.com/api/portal-service/v1/public/cycle-indicators?buId=80",
              "https://www.1line.williams.com/api/portal-service/v1/public/map/menu?buId=80",
              "https://infopost.enbridge.com/api/portal-service/v1/public/cycle-indicators?buId=80",
          ]
          with httpx.Client(headers=UA, timeout=40.0) as c:
              for u in tests:
                  r = c.get(u)
                  ct = r.headers.get("content-type", "")[:24]
                  body = r.text[:250].replace("\n", " ")
                  print(u.split("//")[1][:55], "->", r.status_code, ct)
                  print("   ", body)
          PYEOF
          python /tmp/probe.py
