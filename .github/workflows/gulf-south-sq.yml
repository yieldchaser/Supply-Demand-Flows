name: Gulf South SQ (4× daily)

on:
  schedule:
    # All times UTC, post-publication for each NAESB cycle (Central Time):
    #   Timely cycle:  ~1:00 PM CT → 19:00 UTC  (+1h buffer)
    - cron: '30 19 * * *'
    #   Evening cycle: ~8:00 PM CT → 02:00 UTC  (+30m buffer)
    - cron: '30 2 * * *'
    #   Intraday 1:    ~11:30 AM CT next day → 17:30 UTC
    - cron: '30 17 * * *'
    #   Intraday 2:    ~4:00 PM CT next day → 22:00 UTC
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Cycle code (TIMELY|EVENING|ID1|ID2|ID3)'
        required: false
        default: 'TIMELY'
        type: choice
        options: [TIMELY, EVENING, ID1, ID2, ID3]
      gas_day:
        description: 'Gas day (YYYY-MM-DD, default: today)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gulf-south-sq-${{ github.event.schedule || 'dispatch' }}
  cancel-in-progress: true

jobs:
  fetch:
    name: Fetch and commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Determine cycle from cron schedule
        id: cycle
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CYCLE="${{ inputs.cycle || 'TIMELY' }}"
          else
            # Map UTC cron schedule → cycle code
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "19" ]; then CYCLE="TIMELY"
            elif [ "$HOUR" = "02" ]; then CYCLE="EVENING"
            elif [ "$HOUR" = "17" ]; then CYCLE="ID1"
            else CYCLE="ID2"
            fi
          fi
          echo "cycle=$CYCLE" >> $GITHUB_OUTPUT
          echo "Resolved cycle: $CYCLE"

      - name: Determine gas day
        id: gasday
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.gas_day }}" ]; then
            GAS_DAY="${{ inputs.gas_day }}"
          else
            GAS_DAY=$(date -u +%Y-%m-%d)
          fi
          echo "gas_day=$GAS_DAY" >> $GITHUB_OUTPUT
          echo "Gas day: $GAS_DAY"

      - name: Run Gulf South SQ scraper
        id: scrape
        run: |
          # No cycle/gas_day args: the posting listing is authoritative and
          # its extracted "gas_day" is the POSTING date, not the Eff Gas
          # Day, so wall-clock guesses silently matched nothing (feed
          # stalled 2026-08-21..23 with health 'ok'). With no filters the
          # scraper syncs every missing (cycle, day) on the listing; the
          # raw-file staleness gate makes repeats free.
          python -m scrapers.energy_transfer.gulf_south \
          | tee /tmp/scraper_output.json
          STATUS=$(python -c "import json; print(json.load(open('/tmp/scraper_output.json'))['status'])")
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Transform raw → curated
        if: steps.scrape.outputs.status == 'ok'
        run: python -m transformers.gulf_south

      - name: Run meter inventory
        if: steps.scrape.outputs.status == 'ok'
        run: python -m scrapers.energy_transfer.meter_inventory ${{ steps.gasday.outputs.gas_day }}

      - name: Commit
        if: steps.scrape.outputs.status == 'ok'
        env:
          CYCLE: ${{ steps.cycle.outputs.cycle }}
          GAS_DAY: ${{ steps.gasday.outputs.gas_day }}
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/gulf_south.json || true
          git add data/curated/gulf_south.parquet || true
          git add config/lng_meter_map.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data(gulf-south): SQ ${CYCLE} ${GAS_DAY}"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi

      - name: Report skip
        if: steps.scrape.outputs.status == 'skipped'
        run: echo "Staleness gate held — already have ${{ steps.cycle.outputs.cycle }} ${{ steps.gasday.outputs.gas_day }}"

      - name: Report failure
        if: steps.scrape.outputs.status == 'failed' || failure()
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/gulf_south.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data(gulf-south): health update (failure recorded)"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi
          exit 1
