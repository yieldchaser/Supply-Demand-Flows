name: GASNom OAC (4 LNG pipelines × 5 cycles)

on:
  schedule:
    # All times UTC, post-publication buffer per NAESB cycle (Central Time):
    - cron: '30 2 * * *'   # Evening cycle (~8:00 PM CT) + 30m buffer
    - cron: '0 3 * * *'    # Timely cycle
    - cron: '0 9 * * *'    # Intraday 1
    - cron: '0 13 * * *'   # Intraday 2
    - cron: '0 4 * * *'    # Intraday 3 (early-morning slot)
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Cycle code (timely|evening|id1|id2|id3)'
        required: false
        default: ''
        type: string
      gas_day:
        description: 'Gas day (YYYY-MM-DD, default: today UTC)'
        required: false
        type: string

concurrency:
  group: gasnom-${{ github.event.schedule || 'dispatch' }}
  cancel-in-progress: true

jobs:
  scrape:
    name: ${{ matrix.slug }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One pipeline's WAF hiccup must never mask the others' results.
      fail-fast: false
      matrix:
        slug: [goldenpass, cameron, SABINE, portarthurpipeline]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Determine cycle from cron schedule
        id: cycle
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CYCLE="${{ inputs.cycle }}"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "02" ]; then CYCLE="evening"
            elif [ "$HOUR" = "03" ]; then CYCLE="timely"
            elif [ "$HOUR" = "09" ]; then CYCLE="id1"
            elif [ "$HOUR" = "13" ]; then CYCLE="id2"
            else CYCLE="id3"
            fi
          fi
          echo "cycle=$CYCLE" >> $GITHUB_OUTPUT
          echo "Resolved cycle: '${CYCLE}'"

      - name: Determine gas day
        id: gasday
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.gas_day }}" ]; then
            GAS_DAY="${{ inputs.gas_day }}"
          else
            GAS_DAY=$(date -u +%Y-%m-%d)
          fi
          echo "gas_day=$GAS_DAY" >> $GITHUB_OUTPUT
          echo "Gas day: $GAS_DAY"

      - name: Run GASNom scraper
        id: scrape
        env:
          SLUG_IN: ${{ matrix.slug }}
          CYCLE_IN: ${{ steps.cycle.outputs.cycle }}
          GAS_DAY_IN: ${{ steps.gasday.outputs.gas_day }}
        run: |
          ARGS=""
          if [ -n "$CYCLE_IN" ]; then
            ARGS="--cycle $CYCLE_IN"
          fi
          python -m scrapers.gasnom \
            "$SLUG_IN" \
            $ARGS \
            --date "$GAS_DAY_IN" \
          | tee /tmp/scraper_output.json
          STATUS=$(python -c "import json; print(json.load(open('/tmp/scraper_output.json'))['status'])")
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Upload raw payloads
        uses: actions/upload-artifact@v4
        with:
          name: gasnom-raw-${{ matrix.slug }}
          path: data/raw/gasnom/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload health payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gasnom-health-${{ matrix.slug }}
          path: data/health/gasnom_${{ matrix.slug }}.json
          if-no-files-found: ignore
          retention-days: 3

  publish:
    name: Transform, merge health, and commit
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download all raw payloads
        uses: actions/download-artifact@v4
        with:
          pattern: gasnom-raw-*
          path: data/raw/gasnom/
          merge-multiple: true

      - name: Download all health payloads
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: gasnom-health-*
          path: data/health/
          merge-multiple: true

      - name: Merge pipeline health
        if: always()
        run: python -m scrapers.gasnom.merge_health

      - name: Transform raw to curated
        id: transform
        run: |
          python -m transformers.gasnom || true

      - name: Commit
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/gasnom_*.json data/health/gasnom.json || true
          git add data/curated/gasnom.parquet || true
          if ! git diff --cached --quiet; then
            git commit -m "data(gasnom): update curated and health"
            for i in {1..5}; do
              python -m scrapers.gasnom.merge_health || true
              git add data/health/gasnom.json || true
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi
