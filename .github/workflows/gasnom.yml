name: GASNom OAC (4 LNG pipelines × 5 cycles)

on:
  schedule:
    # All times UTC, post-publication buffer per NAESB cycle (Central Time):
    - cron: '30 2 * * *'   # Evening cycle (~8:00 PM CT) + 30m buffer
    - cron: '0 3 * * *'    # Timely cycle
    - cron: '0 9 * * *'    # Intraday 1
    - cron: '0 13 * * *'   # Intraday 2
    - cron: '0 4 * * *'    # Intraday 3 (early-morning slot)
  workflow_dispatch:
    inputs:
      cycle:
        description: 'Cycle code (timely|evening|id1|id2|id3)'
        required: false
        default: ''
        type: string
      gas_day:
        description: 'Gas day (YYYY-MM-DD, default: today UTC)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gasnom-${{ github.event.schedule || 'dispatch' }}
  cancel-in-progress: true

jobs:
  scrape:
    name: ${{ matrix.slug }}
    runs-on: ubuntu-latest
    strategy:
      # One pipeline's WAF hiccup must never mask the others' results.
      fail-fast: false
      matrix:
        slug: [goldenpass, cameron, SABINE, portarthurpipeline]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Determine cycle from cron schedule
        id: cycle
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CYCLE="${{ inputs.cycle }}"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "02" ]; then CYCLE="evening"
            elif [ "$HOUR" = "03" ]; then CYCLE="timely"
            elif [ "$HOUR" = "09" ]; then CYCLE="id1"
            elif [ "$HOUR" = "13" ]; then CYCLE="id2"
            else CYCLE="id3"
            fi
          fi
          echo "cycle=$CYCLE" >> $GITHUB_OUTPUT
          echo "Resolved cycle: '${CYCLE}'"

      - name: Determine gas day
        id: gasday
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.gas_day }}" ]; then
            GAS_DAY="${{ inputs.gas_day }}"
          else
            GAS_DAY=$(date -u +%Y-%m-%d)
          fi
          echo "gas_day=$GAS_DAY" >> $GITHUB_OUTPUT
          echo "Gas day: $GAS_DAY"

      - name: Run GASNom scraper
        id: scrape
        env:
          SLUG_IN: ${{ matrix.slug }}
          CYCLE_IN: ${{ steps.cycle.outputs.cycle }}
          GAS_DAY_IN: ${{ steps.gasday.outputs.gas_day }}
        run: |
          ARGS=""
          if [ -n "$CYCLE_IN" ]; then
            ARGS="--cycle $CYCLE_IN"
          fi
          python -m scrapers.gasnom \
            "$SLUG_IN" \
            $ARGS \
            --date "$GAS_DAY_IN" \
          | tee /tmp/scraper_output.json
          STATUS=$(python -c "import json; print(json.load(open('/tmp/scraper_output.json'))['status'])")
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Transform raw to curated
        if: steps.scrape.outputs.status == 'ok'
        run: python -m transformers.gasnom

      - name: Commit
        if: steps.scrape.outputs.status == 'ok'
        env:
          SLUG: ${{ matrix.slug }}
          CYCLE: ${{ steps.cycle.outputs.cycle }}
          GAS_DAY: ${{ steps.gasday.outputs.gas_day }}
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/gasnom_${SLUG}.json || true
          git add data/curated/gasnom.parquet || true
          if ! git diff --cached --quiet; then
            git commit -m "data(gasnom): SQ ${SLUG} ${CYCLE} ${GAS_DAY}"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi

      - name: Report skip or empty
        if: steps.scrape.outputs.status == 'skipped' || steps.scrape.outputs.status == 'empty'
        env:
          SLUG: ${{ matrix.slug }}
          SCRAPE_STATUS: ${{ steps.scrape.outputs.status }}
        run: |
          echo "GASNom $SLUG status is $SCRAPE_STATUS - nothing to ingest"

      - name: Report failure
        if: steps.scrape.outputs.status == 'failed' || failure()
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/gasnom_${SLUG}.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data(gasnom): health update for ${SLUG} (failure recorded)"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi
          exit 1
