name: Data Integrity Monitor

on:
  schedule:
    - cron: '0 13 * * *' # 13:00 UTC daily sweep
  workflow_run:
    workflows:
      - "EIA Storage (weekly)"
      - "EIA Supply (monthly)"
      - "EIA LNG Exports (monthly)"
      - "Baker Hughes Rig Count (weekly)"
      - "GIE AGSI+ Storage (daily)"
      - "Gulf South SQ (4× daily)"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrity-check
  cancel-in-progress: false

jobs:
  integrity:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    permissions:
      contents: write
    steps:
      - name: Checkout (fresh main HEAD)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run dataset-integrity audit + send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m validators.run_integrity --alert

      - name: Commit integrity artefacts
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/_integrity_state.json data/health/_integrity_report.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(integrity): update dataset-integrity report + state"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi
