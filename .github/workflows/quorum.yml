name: Quorum IPWS SQ (VG Plaquemines + Calcasieu)

on:
  schedule:
    # Five staggered UTC sweeps. Each GET returns ALL cycles posted so far for
    # the gas day; the raw-file staleness gate makes repeat runs no-ops.
    # Cycle posting anchors observed (tenant-local timestamps): Timely ~5:05 PM,
    # Evening ~9:15 PM, ID1 ~1:15 PM, ID2 ~5:35 PM, ID3 ~10:05 PM.
    - cron: '40 0 * * *'
    - cron: '40 6 * * *'
    - cron: '40 12 * * *'
    - cron: '40 18 * * *'
    - cron: '40 22 * * *'
  workflow_dispatch:
    inputs:
      pipelines:
        description: 'Pipelines to scrape (gator|transcameron)'
        required: false
        default: 'gator,transcameron'
        type: string
      gas_day:
        description: 'Gas day (YYYY-MM-DD, default: today UTC)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: quorum-ipws-${{ github.event.schedule || 'dispatch' }}
  cancel-in-progress: true

env:
  GAS_DAY: ${{ inputs.gas_day || '' }}

jobs:
  scrape:
    name: Scrape TspNo=${{ matrix.tsp }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tsp: 2
            name: gator
          - tsp: 10
            name: transcameron
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Resolve gas day
        id: gasday
        run: |
          if [ -n "$GAS_DAY" ]; then DAY="$GAS_DAY"; else DAY=$(date -u +%F); fi
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "Gas day: $DAY"

      - name: Scrape ExportToCSV (all cycles x all locations)
        env:
          PIPES: ${{ inputs.pipelines || 'gator,transcameron' }}
        run: |
          # Dispatch may restrict pipelines; scheduled runs do both.
          if ! printf '%s' "$PIPES" | grep -qw "${{ matrix.name }}"; then
            echo "${{ matrix.name }} not selected for this dispatch — skipping."
            exit 0
          fi
          python -m scrapers.quorum.pipelines ${{ matrix.name }} ${{ steps.gasday.outputs.day }}

      - name: Copy health for tenant
        if: always()
        run: |
          if [ -f data/health/quorum.json ]; then
            cp data/health/quorum.json data/health/quorum_${{ matrix.name }}.json
          fi

      - name: Upload raw payloads
        uses: actions/upload-artifact@v4
        with:
          name: quorum-raw-${{ matrix.tsp }}
          path: data/raw/quorum/
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload health payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quorum-health-${{ matrix.name }}
          path: data/health/quorum_${{ matrix.name }}.json
          if-no-files-found: ignore
          retention-days: 3

  publish:
    name: Transform and commit
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download all raw payloads
        uses: actions/download-artifact@v4
        with:
          pattern: quorum-raw-*
          path: data/raw/quorum/
          merge-multiple: true

      - name: Download all health payloads
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: quorum-health-*
          path: data/health/
          merge-multiple: true

      - name: Merge tenant health
        if: always()
        run: python -m scrapers.quorum.merge_health

      - name: Transform raw → curated (accumulate)
        id: transform
        run: |
          ls -R data/raw/quorum || true
          python -m transformers.quorum

      - name: Commit
        if: steps.transform.outcome == 'success'
        env:
          DAY: ${{ steps.transform.outputs.day || '' }}
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/curated/quorum.parquet || true
          git add data/health/quorum.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data(quorum): IPWS SQ $(date -u +%F)"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          else
            echo "No curated changes — nothing to commit."
          fi

      - name: Report failure
        if: failure()
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/quorum.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data(quorum): health update (failure recorded)"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi
