name: EIA Trade & Consumption (monthly)

on:
  schedule:
    - cron: '17 16 2,16 * *'  # twice a month; EIA revises recent months
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eia-flows
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run EIA trade & consumption scraper
        id: scrape
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python -m scrapers.eia_api.flows | tee /tmp/scraper_output.json
          STATUS=$(python -c "import json; print(json.load(open('/tmp/scraper_output.json'))['status'])")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" = "ok" ]; then
            LATEST=$(python -c "import json; print(json.load(open('/tmp/scraper_output.json'))['latest_period'])")
            echo "latest=$LATEST" >> $GITHUB_OUTPUT
          fi

      - name: Transform raw -> curated
        if: steps.scrape.outputs.status == 'ok'
        run: python -m transformers.eia_flows

      - name: Commit
        if: steps.scrape.outputs.status == 'ok'
        env:
          LATEST: ${{ steps.scrape.outputs.latest }}
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/eia_flows.json
          git add data/curated/eia_flows.parquet || true
          if ! git diff --cached --quiet; then
            git commit -m "data(eia-flows): trade & consumption to ${LATEST}"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi

      - name: Report failure
        if: steps.scrape.outputs.status != 'ok' || failure()
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/eia_flows.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data(eia-flows): health update (failure recorded)"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi
          exit 1
