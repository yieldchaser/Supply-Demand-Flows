name: Cheniere OAC (2× daily)

on:
  schedule:
    # All times UTC. Cheniere posts OAC per NAESB cycle (Central Time);
    # GetCapacity serves the latest posted cycle per gas day.
    #   Timely:  ~1:00 PM CT → 19:00 UTC (+1h buffer)
    - cron: '0 20 * * *'
    #   Intraday 3 / Evening tail: ~10:15 PM CT → 04:45 UTC (+1h buffer)
    - cron: '45 4 * * *'
  workflow_dispatch:
    inputs:
      gas_day:
        description: 'Gas day (YYYY-MM-DD, default: today)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cheniere-${{ github.event.schedule || 'dispatch' }}
  cancel-in-progress: true

jobs:
  fetch:
    name: Fetch and commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Determine gas day
        id: gasday
        run: |
          if [ -n "${{ inputs.gas_day }}" ]; then
            GAS_DAY="${{ inputs.gas_day }}"
          else
            GAS_DAY=$(date -u +%Y-%m-%d)
          fi
          echo "gas_day=$GAS_DAY" >> $GITHUB_OUTPUT
          echo "Gas day: $GAS_DAY"

      - name: Run Cheniere scraper
        id: scrape
        run: |
          python -m scrapers.cheniere.client ${{ steps.gasday.outputs.gas_day }} \
          | tee /tmp/scraper_output.json
          STATUS=$(python -c "import json; print(json.load(open('/tmp/scraper_output.json'))['status'])")
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Transform raw → curated
        if: steps.scrape.outputs.status == 'ok'
        run: python -m transformers.cheniere

      - name: Commit
        if: steps.scrape.outputs.status == 'ok'
        env:
          GAS_DAY: ${{ steps.gasday.outputs.gas_day }}
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/cheniere.json || true
          git add data/curated/cheniere.parquet || true
          if ! git diff --cached --quiet; then
            git commit -m "data(cheniere): OAC ${GAS_DAY}"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi

      - name: Report skip
        if: steps.scrape.outputs.status == 'skipped'
        run: echo "Staleness gate held — already have ${{ steps.gasday.outputs.gas_day }}"

      - name: Report failure
        if: steps.scrape.outputs.status == 'failed' || failure()
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/cheniere.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data(cheniere): health update (failure recorded)"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi
          exit 1
