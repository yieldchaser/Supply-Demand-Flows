name: Kinder Morgan OpAvail
on:
  schedule:
    - cron: '45 13 * * *'
    - cron: '45 18 * * *'
    - cron: '45 23 * * *'
  workflow_dispatch:

concurrency:
  group: kinder-morgan-${{ github.event.schedule || 'dispatch' }}
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Scrape KM tenants
        run: |
          python -m scrapers.kinder_morgan

      - name: Transform to curated
        if: always()
        run: |
          if ls data/raw/kinder_morgan/*.json >/dev/null 2>&1; then
            python -m transformers.kinder_morgan
          else
            echo "No KM raw payloads — nothing to transform"
          fi

      - name: Commit raw + curated
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/raw/kinder_morgan/ data/curated/kinder_morgan.parquet || true
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "data(kinder_morgan): OpAvail best-available $(date -u +%F)"
            git pull --rebase origin main || true
            git push origin main
          fi
