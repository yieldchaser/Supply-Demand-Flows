name: Kinder Morgan OpAvail
on:
  schedule:
    # NAESB posting clock (CT -> UTC +5): primary run AFTER ITRD3 posts
    # (~09:00 CT on gas day G) so all five cycles land; two later runs catch
    # ITRD2 and late revisions. Times documented in config/meters/kinder_morgan.json.
    - cron: '55 15 * * *' # 10:55 CT — post-ITRD3, full five-cycle capture
    - cron: '45 18 * * *' # 13:45 CT — ITRD2 landed ~01:30 CT
    - cron: '45 23 * * *' # 18:45 CT — evening revisions
  workflow_dispatch:

concurrency:
  group: kinder-morgan-${{ github.event.schedule || 'dispatch' }}
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Scrape KM tenants
        run: |
          python -m scrapers.kinder_morgan

      - name: Transform to curated
        if: always()
        run: |
          if ls data/raw/kinder_morgan/*.json >/dev/null 2>&1; then
            python -m transformers.kinder_morgan
          else
            echo "No KM raw payloads — nothing to transform"
          fi

      - name: Commit raw + curated + health
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/raw/kinder_morgan/ data/curated/kinder_morgan.parquet data/health/kinder_morgan.json || true
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "data(kinder_morgan): OpAvail best-available $(date -u +%F)"
            git pull --rebase origin main || true
            git push origin main
          fi
