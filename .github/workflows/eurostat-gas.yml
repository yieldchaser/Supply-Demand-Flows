name: Eurostat Gas Consumption (weekly)

on:
  schedule:
    - cron: '23 13 * * 2'  # Tuesdays; Eurostat revises the monthly table a few times a month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eurostat-gas
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Eurostat scraper
        id: scrape
        run: |
          python -m scrapers.eurostat.gas_consumption | tee /tmp/scraper_output.json
          STATUS=$(python -c "import json; print(json.load(open('/tmp/scraper_output.json'))['status'])")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" = "ok" ]; then
            GAS_DAY=$(python -c "import json; print(json.load(open('/tmp/scraper_output.json'))['latest_month'])")
            echo "gas_day=$GAS_DAY" >> $GITHUB_OUTPUT
          fi

      - name: Transform raw -> curated
        if: steps.scrape.outputs.status == 'ok'
        run: python -m transformers.eurostat_gas

      - name: Commit
        if: steps.scrape.outputs.status == 'ok'
        env:
          GAS_DAY: ${{ steps.scrape.outputs.gas_day }}
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/eurostat_gas.json || true
          git add data/curated/eurostat_gas.parquet || true
          if ! git diff --cached --quiet; then
            git commit -m "data(eurostat): gas consumption to ${GAS_DAY}"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi

      - name: Report failure
        if: steps.scrape.outputs.status != 'ok' || failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "blue-tide-bot"
          git config user.email "bot@bluetide.local"
          git add data/health/eurostat_gas.json || true
          if ! git diff --cached --quiet; then
            git commit -m "data(eurostat): health update (failure recorded)"
            for i in {1..5}; do
              git pull --rebase --autostash origin main && git push origin main && break || sleep 5
            done
          fi
          exit 1
